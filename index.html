<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d141f">
  <title>QualityOS</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="barra">
    <img src="./icons/icon.svg" alt="" class="logo">
    <div class="marca"><b>QualityOS</b><span id="empresa-nombre"></span></div>
    <span id="nube" class="nube"></span>
    <nav id="menu" hidden>
      <button class="btn chico" data-act="config" aria-label="Configuración">⚙</button>
      <button class="btn chico" data-act="salir">Salir</button>
    </nav>
  </header>

  <main id="vista"></main>
  <div id="aviso" role="status" aria-live="polite"></div>
  <!-- Acá se arma el informe del lote solo al imprimir (ver css @media print). -->
  <div id="imprimir"></div>

  <!-- Scripts clásicos, en este orden: cada uno usa los anteriores. -->
  <script src="./vendor/supabase.js"></script>
  <script src="./js/config.js"></script>
  <script src="./js/reglas.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/nube.js"></script>
  <script src="./js/imprimir.js"></script>
  <script src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
  </script>
</body>
</html>
